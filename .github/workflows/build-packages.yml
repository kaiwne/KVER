name: 📦 Build & Publish XBPS Packages

on:
  push:
    branches:
      - main
    paths:
      - 'srcpkgs/**'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package to build ("all" or specific package name)'
        required: false
        default: 'all'
      force_rebuild_all:
        description: 'Force rebuild all packages regardless of git diff'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  TARGET_ARCH: "x86_64"
  RELEASE_TAG: "x86_64-latest"
  VOID_PKGS_DIR: "/tmp/void-packages"

jobs:
  build-and-publish:
    name: 🛠️ Build & Publish Packages
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged # Grant privileges for chroot/namespaces inside container

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Retain full git history for change detection

      - name: 🧰 Install build tools & create builder user
        run: |
          # Synchronize XBPS and install core tools including sudo
          xbps-install -Syu --yes xbps
          xbps-install -Sy --yes git bash curl jq coreutils github-cli sudo

          # Create dedicated unprivileged user required by xbps-src
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: 🔐 Configure safe git workspace
        run: git config --global --add safe.directory "*"

      - name: 🏗️ Bootstrap xbps-src build environment
        run: |
          # Clone official void-packages infrastructure
          git clone --depth=1 https://github.com/void-linux/void-packages.git "${{ env.VOID_PKGS_DIR }}"
          
          # Enable restricted packages in configuration
          echo "XBPS_ALLOW_RESTRICTED=yes" >> "${{ env.VOID_PKGS_DIR }}/etc/conf"

          # Assign workspace ownership to unprivileged builder user
          chown -R builder:builder "${{ env.VOID_PKGS_DIR }}" "$GITHUB_WORKSPACE"

          # Execute binary-bootstrap as non-root user to satisfy xbps-src security constraints
          su builder -c "cd ${{ env.VOID_PKGS_DIR }} && ./xbps-src binary-bootstrap"

      - name: 🔍 Determine packages to build
        id: detect_pkgs
        run: |
          INPUT_PKG="${{ inputs.package_name }}"
          FORCE_ALL="${{ inputs.force_rebuild_all }}"

          if [ "$FORCE_ALL" = "true" ] || { [ "$INPUT_PKG" = "all" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
            echo "Action: Manual trigger - Building ALL packages"
            PKGS=$(find srcpkgs -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
          elif [ -n "$INPUT_PKG" ] && [ "$INPUT_PKG" != "all" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Action: Manual trigger - Building target package ($INPUT_PKG)"
            PKGS="$INPUT_PKG"
          else
            echo "Action: Auto-detecting modified packages via git diff"
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- 'srcpkgs/' || true)
            PKGS=$(echo "$CHANGED_FILES" | cut -d'/' -f2 | sort -u | grep -v '^$' || true)
          fi

          if [ -z "$(echo "$PKGS" | xargs)" ]; then
            echo "No package changes detected. Skipping build."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            PKGS_FLAT=$(echo "$PKGS" | tr '\n' ' ' | xargs)
            echo "Packages to build: $PKGS_FLAT"
            echo "pkgs=$PKGS_FLAT" >> $GITHUB_OUTPUT
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: ⚙️ Build packages with xbps-src
        if: steps.detect_pkgs.outputs.skip_build != 'true'
        run: |
          # Copy common build files if present
          if [ -d "$GITHUB_WORKSPACE/common" ]; then
            cp -rf "$GITHUB_WORKSPACE/common"/* "${{ env.VOID_PKGS_DIR }}/common/"
          fi

          # Sync target package templates into void-packages
          for pkg in ${{ steps.detect_pkgs.outputs.pkgs }}; do
            if [ -d "$GITHUB_WORKSPACE/srcpkgs/$pkg" ]; then
              echo "==> Syncing srcpkgs/$pkg to build workspace..."
              cp -rf "$GITHUB_WORKSPACE/srcpkgs/$pkg" "${{ env.VOID_PKGS_DIR }}/srcpkgs/"
            else
              echo "⚠️ Warning: Directory srcpkgs/$pkg not found!"
            fi
          done

          # Re-apply ownership for non-root execution
          chown -R builder:builder "${{ env.VOID_PKGS_DIR }}"

          # Compile targets as builder user
          for pkg in ${{ steps.detect_pkgs.outputs.pkgs }}; do
            if [ -d "${{ env.VOID_PKGS_DIR }}/srcpkgs/$pkg" ]; then
              echo "==> Building package: $pkg"
              su builder -c "cd ${{ env.VOID_PKGS_DIR }} && ./xbps-src -m masterdir pkg $pkg"
            fi
          done

      - name: 🔏 Sign packages & update repository index
        if: steps.detect_pkgs.outputs.skip_build != 'true'
        env:
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
        run: |
          KEY_PATH="/tmp/xbps_privkey.pem"
          echo "$XBPS_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          BINPKGS_DIR="${{ env.VOID_PKGS_DIR }}/hostdir/binpkgs"

          # Sign compiled binary packages (.xbps -> .sig2)
          xbps-rindex --sign-pkg --privkey "$KEY_PATH" "$BINPKGS_DIR"/*.xbps

          # Update repository repodata index
          xbps-rindex --add "$BINPKGS_DIR"/*.xbps

          # Sign repository repodata index
          xbps-rindex --sign --privkey "$KEY_PATH" "$BINPKGS_DIR"/${{ env.TARGET_ARCH }}-repodata

      - name: 🚀 Overwrite GitHub Release
        if: steps.detect_pkgs.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Isolate release artifacts into staging directory
          DIST_DIR="/tmp/dist_release"
          mkdir -p "$DIST_DIR"

          BINPKGS_DIR="${{ env.VOID_PKGS_DIR }}/hostdir/binpkgs"
          cp -v "$BINPKGS_DIR"/*.xbps "$DIST_DIR"/ 2>/dev/null || true
          cp -v "$BINPKGS_DIR"/*.sig2 "$DIST_DIR"/ 2>/dev/null || true
          cp -v "$BINPKGS_DIR"/${{ env.TARGET_ARCH }}-repodata* "$DIST_DIR"/ 2>/dev/null || true

          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RELEASE_TITLE="${{ env.TARGET_ARCH }} - Latest Release"
          RELEASE_BODY="<small>${{ env.TARGET_ARCH }} - Build ${BUILD_TIME}</small>"

          # Overwrite GitHub Release target
          gh release delete "${{ env.RELEASE_TAG }}" --yes --cleanup-tag || true
          git tag -f "${{ env.RELEASE_TAG }}"
          git push origin "${{ env.RELEASE_TAG }}" --force

          gh release create "${{ env.RELEASE_TAG }}" "$DIST_DIR"/* \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_BODY"

      - name: 🧹 Cleanup sensitive credentials
        if: always()
        run: rm -f /tmp/xbps_privkey.pem
