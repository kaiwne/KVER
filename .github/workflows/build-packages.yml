name: 🏗️ Build & Publish XBPS Packages

on:
  push:
    branches:
      - main
    paths:
      - 'srcpkgs/**'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Target package to build ("all" or specific package name)'
        required: false
        default: 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TARGET_ARCH: "x86_64"
  RELEASE_TAG: "x86_64-latest"
  VOID_PKGS_DIR: "/tmp/void-packages"

jobs:
  build-and-publish:
    name: 🛠️ Build & Publish Packages
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged
      volumes:
        - /dev:/dev

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup build environment & builder user
        run: |
          # Synchronize package database and install essential utilities
          xbps-install -Syu -y xbps
          xbps-install -Sy -y git bash curl jq coreutils github-cli sudo xtools

          # Create unprivileged user in 'xbuilder' group to grant uchroot execution permissions
          useradd -G xbuilder -m -s /bin/bash builder || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: 🔐 Configure safe git workspace
        run: git config --global --add safe.directory "*"

      - name: 🔍 Determine packages to build
        id: detect
        run: |
          INPUT_PKG="${{ inputs.package_name }}"
          PKGS=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_PKG" ] && [ "$INPUT_PKG" != "all" ]; then
            echo "Action: Manual request for single package ($INPUT_PKG)"
            PKGS="$INPUT_PKG"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$INPUT_PKG" = "all" ]; then
            echo "Action: Manual request for ALL packages"
            PKGS=$(find srcpkgs -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
          else
            echo "Action: Auto-detecting modified packages via git diff"
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'srcpkgs/' || true)
            PKGS=$(echo "$CHANGED" | cut -d'/' -f2 | sort -u | grep -v '^$' || true)
          fi

          FLAT_PKGS=$(echo "$PKGS" | xargs)
          if [ -z "$FLAT_PKGS" ]; then
            echo "No package changes detected. Skipping build phase."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Packages scheduled for build: $FLAT_PKGS"
            echo "pkgs=$FLAT_PKGS" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏗️ Setup void-packages workspace
        if: steps.detect.outputs.skip != 'true'
        run: |
          # Clone upstream void-packages build tree
          git clone --depth=1 https://github.com/void-linux/void-packages.git "${{ env.VOID_PKGS_DIR }}"

          # Configure uchroot isolation backend
          cat << 'EOF' >> "${{ env.VOID_PKGS_DIR }}/etc/conf"
          XBPS_ALLOW_RESTRICTED=yes
          XBPS_CHROOT_CMD=uchroot
          EOF

          # Copy local srcpkgs templates into build workspace
          for pkg in ${{ steps.detect.outputs.pkgs }}; do
            if [ -d "$GITHUB_WORKSPACE/srcpkgs/$pkg" ]; then
              echo "==> Copying srcpkgs/$pkg to build workspace..."
              cp -rf "$GITHUB_WORKSPACE/srcpkgs/$pkg" "${{ env.VOID_PKGS_DIR }}/srcpkgs/"
            fi
          done

          # Copy optional common files if present
          if [ -d "$GITHUB_WORKSPACE/common" ]; then
            cp -rf "$GITHUB_WORKSPACE/common"/* "${{ env.VOID_PKGS_DIR }}/common/"
          fi

          # Assign workspace ownership to builder user
          chown -R builder:builder "${{ env.VOID_PKGS_DIR }}"

      - name: ⚙️ Bootstrap & Build packages
        if: steps.detect.outputs.skip != 'true'
        run: |
          # Initialize binary-bootstrap under builder user
          su - builder -c "cd ${{ env.VOID_PKGS_DIR }} && ./xbps-src binary-bootstrap"

          # Compile scheduled target packages
          for pkg in ${{ steps.detect.outputs.pkgs }}; do
            echo "==> Building target package: $pkg"
            su - builder -c "cd ${{ env.VOID_PKGS_DIR }} && ./xbps-src -f pkg $pkg"
          done

      - name: 🔏 Sign packages & update repodata
        if: steps.detect.outputs.skip != 'true'
        env:
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
        run: |
          BINPKGS_DIR="${{ env.VOID_PKGS_DIR }}/hostdir/binpkgs"

          # Verify output binaries exist before signing
          if ! ls "$BINPKGS_DIR"/*.xbps 1>/dev/null 2>&1; then
            echo "❌ Error: No built .xbps artifacts found!"
            exit 1
          fi

          # Sign packages and repodata index if private key is configured
          if [ -n "$XBPS_PRIVATE_KEY" ]; then
            KEY_PATH="/tmp/xbps_privkey.pem"
            echo "$XBPS_PRIVATE_KEY" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"

            echo "🔑 Signing binary packages..."
            xbps-rindex --sign-pkg --privkey "$KEY_PATH" "$BINPKGS_DIR"/*.xbps

            echo "📊 Updating repodata index..."
            xbps-rindex --add "$BINPKGS_DIR"/*.xbps

            echo "🔏 Signing repodata index..."
            xbps-rindex --sign --privkey "$KEY_PATH" "$BINPKGS_DIR"/${{ env.TARGET_ARCH }}-repodata

            rm -f "$KEY_PATH"
          else
            echo "⚠️ Notice: secrets.XBPS_PRIVATE_KEY missing. Generating index without RSA signatures."
            xbps-rindex --add "$BINPKGS_DIR"/*.xbps
          fi

      - name: 🚀 Publish release assets to GitHub
        if: steps.detect.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIST_DIR="/tmp/dist_release"
          mkdir -p "$DIST_DIR"

          BINPKGS_DIR="${{ env.VOID_PKGS_DIR }}/hostdir/binpkgs"
          cp -v "$BINPKGS_DIR"/*.xbps "$DIST_DIR"/ 2>/dev/null || true
          cp -v "$BINPKGS_DIR"/*.sig2 "$DIST_DIR"/ 2>/dev/null || true
          cp -v "$BINPKGS_DIR"/${{ env.TARGET_ARCH }}-repodata* "$DIST_DIR"/ 2>/dev/null || true

          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RELEASE_TITLE="XBPS Binary Repository (${{ env.TARGET_ARCH }})"
          RELEASE_NOTES="Automated repository release updated at ${BUILD_TIME} (commit: ${{ github.sha }})"

          # Update GitHub Release tag cleanly
          gh release delete "${{ env.RELEASE_TAG }}" --yes --cleanup-tag || true
          git tag -f "${{ env.RELEASE_TAG }}"
          git push origin "${{ env.RELEASE_TAG }}" --force

          gh release create "${{ env.RELEASE_TAG }}" "$DIST_DIR"/* \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES"

      - name: 🧹 Cleanup sensitive credentials
        if: always()
        run: rm -f /tmp/xbps_privkey.pem
