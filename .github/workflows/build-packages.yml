name: 🏗️ Build & Publish XBPS Packages

on:
  push:
    branches:
      - main
    paths:
      - 'srcpkgs/**'
      - 'common/**'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package to build ("all" or specific package name)'
        required: false
        default: 'all'
      force_rebuild:
        description: 'Force rebuild all packages regardless of git diff'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TARGET_ARCH: "x86_64"
  RELEASE_TAG: "x86_64-latest"
  VOID_PKGS_DIR: "/tmp/void-packages"

jobs:
  build-and-publish:
    name: 🛠️ Build & Publish Packages
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup build environment & non-root user
        run: |
          # Synchronize package database and install essential build tooling
          xbps-install -Syu --yes xbps
          xbps-install -Sy --yes git bash curl jq coreutils github sudo

          # Create unprivileged 'builder' user required by xbps-src security check
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: 🔐 Configure safe git workspace
        run: git config --global --add safe.directory "*"

      - name: 🔍 Determine packages to build
        id: detect
        run: |
          INPUT_PKG="${{ inputs.package_name }}"
          FORCE_BUILD="${{ inputs.force_rebuild }}"
          
          PKGS=""
          if [ "$FORCE_BUILD" = "true" ] || { [ "$INPUT_PKG" = "all" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
            echo "Action: Building ALL packages in srcpkgs/"
            PKGS=$(find srcpkgs -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
          elif [ -n "$INPUT_PKG" ] && [ "$INPUT_PKG" != "all" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Action: Building target package: $INPUT_PKG"
            PKGS="$INPUT_PKG"
          else
            echo "Action: Auto-detecting modified packages via git diff"
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- 'srcpkgs/' || true)
            PKGS=$(echo "$CHANGED_FILES" | cut -d'/' -f2 | sort -u | grep -v '^$' || true)
          fi

          PKGS_FLAT=$(echo "$PKGS" | xargs)
          if [ -z "$PKGS_FLAT" ]; then
            echo "No package changes detected. Skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Packages scheduled to build: $PKGS_FLAT"
            echo "pkgs=$PKGS_FLAT" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏗️ Bootstrap xbps-src environment
        if: steps.detect.outputs.skip != 'true'
        run: |
          # Clone upstream void-packages build environment
          git clone --depth=1 https://github.com/void-linux/void-packages.git "${{ env.VOID_PKGS_DIR }}"
          
          # Set 'ethereal' chroot backend designed specifically for Docker CI containers
          echo "XBPS_ALLOW_RESTRICTED=yes" >> "${{ env.VOID_PKGS_DIR }}/etc/conf"
          echo "XBPS_CHROOT_CMD=ethereal" >> "${{ env.VOID_PKGS_DIR }}/etc/conf"

          # Sync local custom common files (e.g., shlibs) if present
          if [ -d "$GITHUB_WORKSPACE/common" ]; then
            cp -rf "$GITHUB_WORKSPACE/common"/* "${{ env.VOID_PKGS_DIR }}/common/"
          fi

          # Grant non-root user full ownership of workspace
          chown -R builder:builder "${{ env.VOID_PKGS_DIR }}" "$GITHUB_WORKSPACE"

          # Initialize binary bootstrap under builder user
          su - builder -c "cd ${{ env.VOID_PKGS_DIR }} && ./xbps-src binary-bootstrap"

      - name: ⚙️ Build packages
        if: steps.detect.outputs.skip != 'true'
        run: |
          # Copy target package templates into void-packages workspace
          for pkg in ${{ steps.detect.outputs.pkgs }}; do
            if [ -d "$GITHUB_WORKSPACE/srcpkgs/$pkg" ]; then
              echo "==> Syncing srcpkgs/$pkg..."
              cp -rf "$GITHUB_WORKSPACE/srcpkgs/$pkg" "${{ env.VOID_PKGS_DIR }}/srcpkgs/"
            fi
          done

          # Re-apply permissions after copying new files
          chown -R builder:builder "${{ env.VOID_PKGS_DIR }}"

          # Build packages sequentially as unprivileged builder user
          for pkg in ${{ steps.detect.outputs.pkgs }}; do
            if [ -d "${{ env.VOID_PKGS_DIR }}/srcpkgs/$pkg" ]; then
              echo "==> Building package: $pkg"
              su - builder -c "cd ${{ env.VOID_PKGS_DIR }} && ./xbps-src -f pkg $pkg"
            fi
          done

      - name: 🔏 Sign packages & generate repodata
        if: steps.detect.outputs.skip != 'true'
        env:
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
        run: |
          BINPKGS_DIR="${{ env.VOID_PKGS_DIR }}/hostdir/binpkgs"

          # Validate output directory contains built .xbps binaries
          if ! ls "$BINPKGS_DIR"/*.xbps 1>/dev/null 2>&1; then
            echo "❌ Error: No binary packages found after build step!"
            exit 1
          fi

          # Sign binaries and repodata index if private key secret exists
          if [ -n "$XBPS_PRIVATE_KEY" ]; then
            KEY_PATH="/tmp/xbps_privkey.pem"
            echo "$XBPS_PRIVATE_KEY" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"

            echo "🔑 Signing binary packages..."
            xbps-rindex --sign-pkg --privkey "$KEY_PATH" "$BINPKGS_DIR"/*.xbps

            echo "📊 Updating repository index..."
            xbps-rindex --add "$BINPKGS_DIR"/*.xbps

            echo "🔏 Signing repository repodata..."
            xbps-rindex --sign --privkey "$KEY_PATH" "$BINPKGS_DIR"/${{ env.TARGET_ARCH }}-repodata

            rm -f "$KEY_PATH"
          else
            echo "⚠️ Notice: secrets.XBPS_PRIVATE_KEY is missing. Generating index without RSA signature."
            xbps-rindex --add "$BINPKGS_DIR"/*.xbps
          fi

      - name: 🚀 Publish release to GitHub
        if: steps.detect.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIST_DIR="/tmp/dist_release"
          mkdir -p "$DIST_DIR"

          BINPKGS_DIR="${{ env.VOID_PKGS_DIR }}/hostdir/binpkgs"
          cp -v "$BINPKGS_DIR"/*.xbps "$DIST_DIR"/ 2>/dev/null || true
          cp -v "$BINPKGS_DIR"/*.sig2 "$DIST_DIR"/ 2>/dev/null || true
          cp -v "$BINPKGS_DIR"/${{ env.TARGET_ARCH }}-repodata* "$DIST_DIR"/ 2>/dev/null || true

          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RELEASE_TITLE="${{ env.TARGET_ARCH }} - Latest Release"
          RELEASE_BODY="<small>${{ env.TARGET_ARCH }} - Build ${BUILD_TIME}</small>"

          # Overwrite GitHub Release tag cleanly
          gh release delete "${{ env.RELEASE_TAG }}" --yes --cleanup-tag || true
          git tag -f "${{ env.RELEASE_TAG }}"
          git push origin "${{ env.RELEASE_TAG }}" --force

          gh release create "${{ env.RELEASE_TAG }}" "$DIST_DIR"/* \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_BODY"

      - name: 🧹 Cleanup sensitive credentials
        if: always()
        run: rm -f /tmp/xbps_privkey.pem
