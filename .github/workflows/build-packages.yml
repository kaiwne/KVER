name: 🏗️ Build Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'srcpkgs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Detect package changes
  # ==========================================
  detect:
    name: 🔎 Detect Package Changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-pkgs.outputs.packages }}
      has_changes: ${{ steps.set-pkgs.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed or missing packages
        id: set-pkgs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHANGED_PKGS=()

          # 1. Scan modified package templates on Git push
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE_SHA="${{ github.event.before }}"
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BEFORE_SHA="HEAD~1"
            fi
            
            git_diff_pkgs=$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" | grep '^srcpkgs/' | cut -d'/' -f2 | sort -u || true)
            for pkg in $git_diff_pkgs; do
              [ -f "srcpkgs/$pkg/template" ] && CHANGED_PKGS+=("$pkg")
            done
          fi

          # 2. Scan unbuilt or updated packages on manual workflow dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_ASSETS=$(curl -sH "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | grep -oE '"name": *"[^"]+"' | cut -d'"' -f4 || true)

            for dir in srcpkgs/*; do
              if [ -f "$dir/template" ]; then
                pkg=$(basename "$dir")
                version=$(grep -E '^version=' "$dir/template" | cut -d'=' -f2 | tr -d '"' | tr -d "'")
                revision=$(grep -E '^revision=' "$dir/template" | cut -d'=' -f2 | tr -d '"' | tr -d "'")
                expected_pattern="${pkg}-${version}_${revision}."
                if ! echo "$RELEASE_ASSETS" | grep -qF "$expected_pattern"; then
                  CHANGED_PKGS+=("$pkg")
                fi
              fi
            done
          fi

          # Deduplicate package list
          UNIQUE_PKGS=($(printf '%s\n' "${CHANGED_PKGS[@]}" | sort -u | tr '\n' ' '))

          if [ ${#UNIQUE_PKGS[@]} -eq 0 ]; then
            echo "No packages need building."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "packages=[]" >> "$GITHUB_OUTPUT"
          else
            JSON_MATRIX=$(jq -nc '$ARGS.positional' --args "${UNIQUE_PKGS[@]}")
            echo "Packages to build: $JSON_MATRIX"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "packages=$JSON_MATRIX" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================
  # JOB 2: Build & Sign packages
  # ==========================================
  build-and-sign:
    name: 🏗️ Build & Sign Packages (${{ matrix.arch }})
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            libc: glibc
            platform: linux/amd64

    container:
      image: ghcr.io/void-linux/void-${{ matrix.libc }}-full:latest
      options: --platform ${{ matrix.platform }} --privileged
      volumes:
        - /dev:/dev

    steps:
      - name: Prepare container environment
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          env -u XBPS_TARGET_ARCH xbps-install -Syu -y xbps
          env -u XBPS_TARGET_ARCH xbps-install -yu
          env -u XBPS_TARGET_ARCH xbps-install -y sudo bash curl grep jq zip unzip git github-cli xtools coreutils
          useradd -G xbuilder -M builder -s $(which bash) || true

      - name: Checkout upstream void-packages
        uses: actions/checkout@v4
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages

      - name: Patch setup scripts for container compatibility
        working-directory: void-packages
        run: |
          sed -i 's@for var in $(awk .*;@for var in $(printenv | cut -d'"'"'='"'"' -f1);@' common/environment/setup/sourcepkg.sh

      - name: Merge local repository and fetch existing binary release
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          git remote add -f myrepo "https://github.com/$REPO_OWNER/$REPO_NAME.git"
          git merge --no-commit --strategy-option=theirs --allow-unrelated-histories -Xignore-space-change myrepo/main
          
          mkdir -p hostdir/binpkgs
          gh release download "$ARCH-latest" --pattern "*" --dir hostdir/binpkgs --repo "$REPO_OWNER/$REPO_NAME" || true
          rm -f hostdir/binpkgs/*.sig2

      - name: Build target packages
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.arch }}
          TARGET_PKGS_JSON: ${{ needs.detect.outputs.packages }}
        run: |
          chown -R builder:builder .

          RAW_PKGS=$(echo "$TARGET_PKGS_JSON" | jq -r '.[]')
          if [ -z "$RAW_PKGS" ]; then
            echo "No packages provided for building."
            exit 0
          fi

          # Sort packages according to dependency order
          PKGS=$(sudo -Eu builder ./xbps-src sort-dependencies $RAW_PKGS)

          # Clean old binaries for packages being rebuilt
          for pkg in $PKGS; do
            sudo -Eu builder find hostdir/binpkgs -name "${pkg}-*.xbps" -exec rm -fv {} + || true
            sudo -Eu builder find hostdir/binpkgs -name "${pkg}-*.sig2" -exec rm -fv {} + || true
          done

          # Configure xbps-src build environment
          mkdir -p etc
          cat << 'EOF' > etc/conf
          XBPS_BUILD_ENVIRONMENT=void-packages-ci
          XBPS_ALLOW_RESTRICTED=yes
          XBPS_CHROOT_CMD=uchroot
          XBPS_REPOSITORY=$PWD/hostdir/binpkgs
          XBPS_DISTDIR=$PWD/hostdir/distfiles
          XBPS_MASTERDIR_PKGS="$PWD/hostdir/binpkgs"
          EOF

          # Bootstrap build chroot
          sudo -Eu builder ./xbps-src -m masterdir-${ARCH} -A ${ARCH} binary-bootstrap

          # Build packages in sorted dependency order
          for pkg in $PKGS; do
            echo "Building package: $pkg"
            sudo -Eu builder ./xbps-src -f pkg -j$(nproc) -m masterdir-${ARCH} -A ${ARCH} "$pkg"
          done

      - name: Sign packages and generate repodata index
        working-directory: void-packages/hostdir/binpkgs
        env:
          PRIV_KEY: ${{ secrets.XBPS_PRIVATE_KEY || secrets.PRIV_KEY }}
          ARCH: ${{ matrix.arch }}
          MAINTAINER: "${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>"
        run: |
          set -e
          rm -f "${ARCH}-repodata"

          count=$(ls -1 *.xbps 2>/devnull | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No .xbps packages found. Skipping repository indexing."
            exit 0
          fi

          # Index repository binaries
          xbps-rindex -a *.xbps

          # Sign repository index and package binaries if private key is present
          if [ -n "$PRIV_KEY" ]; then
            printf "%s\n" "$PRIV_KEY" > private.pem
            chmod 600 private.pem

            xbps-rindex -s --signedby "$MAINTAINER" --privkey private.pem "$PWD"
            xbps-rindex -S --privkey private.pem *.xbps
            xbps-rindex -c "$PWD"

            rm -f private.pem
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-repository
          path: void-packages/hostdir/binpkgs/
          retention-days: 5

  # ==========================================
  # JOB 3: Publish GitHub Release
  # ==========================================
  publish-release:
    name: 📦 Publish GitHub Release
    needs: [detect, build-and-sign]
    if: needs.build-and-sign.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: x86_64-repository
          path: ./release-assets

      - name: Deploy release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "x86_64-latest"
        run: |
          set -euo pipefail

          # Re-create release tag to publish fresh assets cleanly
          gh release delete "$TAG" --cleanup-tag -y || true

          gh release create "$TAG" \
            --title "XBPS Binary Repository (x86_64)" \
            --notes "Automated repository update at commit ${{ github.sha }}"

          gh release upload "$TAG" ./release-assets/* --clobber
