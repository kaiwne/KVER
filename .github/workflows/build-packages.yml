name: 📦 Build & Publish XBPS Packages

on:
  push:
    branches:
      - main
    paths:
      - 'srcpkgs/**'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package to build ("all" or specific package name)'
        required: false
        default: 'all'
      force_rebuild_all:
        description: 'Force rebuild all packages regardless of git diff'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  TARGET_ARCH: "x86_64"
  RELEASE_TAG: "x86_64-latest"
  VOID_PKGS_DIR: "/tmp/void-packages"

jobs:
  build-and-publish:
    name: 🛠️ Build & Publish Packages
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Retain history for git diff detection

      - name: 🧰 Install system build tools
        run: |
          xbps-install -Syu --yes xbps
          xbps-install -Sy --yes git bash curl jq coreutils github-cli

      - name: 🔐 Configure safe git workspace
        run: git config --global --add safe.directory "*"

      - name: 🏗️ Bootstrap xbps-src build environment
        run: |
          # Shallow clone official void-packages to provide xbps-src infrastructure
          git clone --depth=1 https://github.com/void-linux/void-packages.git "${{ env.VOID_PKGS_DIR }}"
          
          # Enable restricted packages and bootstrap masterdir
          echo "XBPS_ALLOW_RESTRICTED=yes" >> "${{ env.VOID_PKGS_DIR }}/etc/conf"
          "${{ env.VOID_PKGS_DIR }}/xbps-src" binary-bootstrap

      - name: 🔍 Determine packages to build
        id: detect_pkgs
        run: |
          INPUT_PKG="${{ inputs.package_name }}"
          FORCE_ALL="${{ inputs.force_rebuild_all }}"

          if [ "$FORCE_ALL" = "true" ] || [ "$INPUT_PKG" = "all" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Action: Manual request - Building ALL packages"
            PKGS=$(find srcpkgs -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
          elif [ -n "$INPUT_PKG" ] && [ "$INPUT_PKG" != "all" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Action: Manual request - Building target package ($INPUT_PKG)"
            PKGS="$INPUT_PKG"
          else
            echo "Action: Auto-detecting modified packages via git diff"
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- 'srcpkgs/' || true)
            PKGS=$(echo "$CHANGED_FILES" | cut -d'/' -f2 | sort -u | grep -v '^$' || true)
          fi

          if [ -z "$(echo "$PKGS" | xargs)" ]; then
            echo "No package changes detected. Skipping build."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            PKGS_FLAT=$(echo "$PKGS" | tr '\n' ' ' | xargs)
            echo "Packages to build: $PKGS_FLAT"
            echo "pkgs=$PKGS_FLAT" >> $GITHUB_OUTPUT
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: ⚙️ Build packages with xbps-src
        if: steps.detect_pkgs.outputs.skip_build != 'true'
        run: |
          # Merge overlay files (common & custom package templates) into void-packages
          [ -d "common" ] && cp -rf common/* "${{ env.VOID_PKGS_DIR }}/common/"
          
          for pkg in ${{ steps.detect_pkgs.outputs.pkgs }}; do
            if [ -d "srcpkgs/$pkg" ]; then
              echo "==> Syncing srcpkgs/$pkg to build workspace..."
              cp -rf "srcpkgs/$pkg" "${{ env.VOID_PKGS_DIR }}/srcpkgs/"
              
              echo "==> Building package: $pkg"
              "${{ env.VOID_PKGS_DIR }}/xbps-src" -m masterdir pkg "$pkg"
            else
              echo "⚠️ Warning: Package directory srcpkgs/$pkg not found!"
            fi
          done

      - name: 🔏 Sign packages & update repository index
        if: steps.detect_pkgs.outputs.skip_build != 'true'
        env:
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
        run: |
          KEY_PATH="/tmp/xbps_privkey.pem"
          echo "$XBPS_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          BINPKGS_DIR="${{ env.VOID_PKGS_DIR }}/hostdir/binpkgs"

          # Sign all newly generated .xbps binary packages
          xbps-rindex --sign-pkg --privkey "$KEY_PATH" "$BINPKGS_DIR"/*.xbps

          # Register packages into repodata index
          xbps-rindex --add "$BINPKGS_DIR"/*.xbps

          # Sign repodata index
          xbps-rindex --sign --privkey "$KEY_PATH" "$BINPKGS_DIR"/${{ env.TARGET_ARCH }}-repodata

      - name: 🚀 Overwrite GitHub Release
        if: steps.detect_pkgs.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BINPKGS_DIR="${{ env.VOID_PKGS_DIR }}/hostdir/binpkgs"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          RELEASE_TITLE="${{ env.TARGET_ARCH }} - Latest Release"
          RELEASE_BODY="<small>${{ env.TARGET_ARCH }} - Build ${BUILD_TIME}</small>"

          # Force re-create tag and overwrite GitHub Release
          gh release delete "${{ env.RELEASE_TAG }}" --yes --cleanup-tag || true
          git tag -f "${{ env.RELEASE_TAG }}"
          git push origin "${{ env.RELEASE_TAG }}" --force

          gh release create "${{ env.RELEASE_TAG }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_BODY" \
            "$BINPKGS_DIR"/*.xbps \
            "$BINPKGS_DIR"/*.sig2 \
            "$BINPKGS_DIR"/${{ env.TARGET_ARCH }}-repodata*

      - name: 🧹 Cleanup sensitive credentials
        if: always()
        run: rm -f /tmp/xbps_privkey.pem
